<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Appointment | MEDICARE</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="inner-page">
    <header>
      <h1>MEDICARE</h1>
      <p>Your Health, Our Priority.</p>
    </header>

    <main class="appointment-container">
      <h2>Book Your Appointment</h2>
      <p>Complete the form below to schedule your hospital visit.</p>

      <form id="appointmentForm">
        <label>Full Name</label>
        <input type="text" id="full_name" required />

        <label>Email Address</label>
        <input type="email" id="email" required />

        <label>Phone Number</label>
        <input type="tel" id="phone" required />

        <label>Select Hospital</label>
        <select id="hospital" required>
          <option value="">Loading hospitals...</option>
        </select>

        <label>Select Department</label>
        <select id="department" required>
          <option value="">Select a hospital first</option>
        </select>

        <label>Select Doctor</label>
        <select id="doctor" required>
          <option value="">Select a department first</option>
        </select>

        <label>Appointment Date</label>
        <input type="date" id="appointment_date" required />

        <label>Appointment Time</label>
        <input type="time" id="appointment_time" required />

        <label>Reason for Appointment</label>
        <textarea
          id="reason"
          placeholder="Describe your reason for visiting"
        ></textarea>

        <button type="submit">Book Appointment</button>
      </form>

      <div id="message"></div>
    </main>

    <script src="js/appointments.js"></script>
  </body>
</html>
